[project]
name = "sanka-migrate-mcp"
version = "0.1.0a4"
description = "Credential-free MCP tools for Sanka research and assessments"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sanka, Inc." }]
keywords = ["mcp", "migration", "research", "sanka"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
  "pydantic>=2.11,<3",
  # 2.15 emits an upstream unresolved FastMCP lifespan warning at startup.
  "pydantic-settings>=2.5.2,<2.15",
]

[project.urls]
Repository = "https://github.com/sankaHQ/sanka"
Issues = "https://github.com/sankaHQ/sanka/issues"

[project.scripts]
sanka-migrate-mcp = "sanka_migrate_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_migrate_mcp"]
