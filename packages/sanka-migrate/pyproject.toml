[project]
name = "sanka-migrate"
version = "0.1.0a6"
description = "Sanka — inspect, plan, execute, and verify migrations across applications and data systems"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE", "NOTICE"]
authors = [{ name = "Sanka, Inc." }]
keywords = ["migration", "etl", "sanka", "data", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "clickhouse-connect>=0.8",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
]

[project.scripts]
sanka = "sanka.cli:main"
sanka-migrate = "sanka.cli:main"

[project.entry-points."sanka.connectors"]
clickhouse = "sanka_connector_clickhouse:CONNECTOR"
csv = "sanka_connector_csv:CONNECTOR"
hubspot = "sanka_connector_hubspot:CONNECTOR"
markdown = "sanka_connector_markdown:CONNECTOR"
netsuite = "sanka_connector_netsuite:CONNECTOR"
postgres = "sanka_connector_postgres:CONNECTOR"
salesforce = "sanka_connector_salesforce:CONNECTOR"
sendgrid = "sanka_connector_sendgrid:CONNECTOR"
sqlite = "sanka_connector_sqlite:CONNECTOR"

[project.urls]
Repository = "https://github.com/sankaHQ/sanka"
Issues = "https://github.com/sankaHQ/sanka/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/sanka",
  "src/sanka_connector_clickhouse",
  "src/sanka_connector_csv",
  "src/sanka_connector_hubspot",
  "src/sanka_connector_markdown",
  "src/sanka_connector_netsuite",
  "src/sanka_connector_postgres",
  "src/sanka_connector_salesforce",
  "src/sanka_connector_sendgrid",
  "src/sanka_connector_sqlite",
]
