[project]
name = "sanka-migrate"
version = "0.1.0a10"
description = "Sanka — inspect, plan, execute, and verify migrations across applications and data systems"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
keywords = ["migration", "etl", "sanka", "data", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pyyaml>=6",
  "sanka-connector-sdk>=0.1.0a9,<0.2",
]

[project.optional-dependencies]
compatibility = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
sanka-migrate = "sanka.cli:main"

[project.urls]
Repository = "https://github.com/sankaHQ/sanka"
Issues = "https://github.com/sankaHQ/sanka/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/sanka",
]
