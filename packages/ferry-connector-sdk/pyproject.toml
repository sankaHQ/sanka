[project]
name = "sanka-migrate-connector-sdk"
version = "0.1.0.dev0"
description = "Sanka Migrate Connector SDK — Apache-2.0 interfaces and shared types for migration connectors"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sanka, Inc." }]
keywords = ["migration", "connector", "sanka", "data"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/sankaHQ/sanka-migrate"
Issues = "https://github.com/sankaHQ/sanka-migrate/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["src/ferry"]
