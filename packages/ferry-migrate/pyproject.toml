[project]
name = "sanka-migrate"
version = "0.1.0.dev0"
description = "Sanka Migrate Runtime — plan, execute, and verify finite migrations between databases, warehouses, files, and business systems"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
keywords = ["migration", "etl", "sanka", "data", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "sanka-migrate-connector-sdk",
  "pyyaml>=6",
]

[project.scripts]
sanka-migrate = "ferry.cli:main"
ferry = "ferry.cli:main"

[project.urls]
Repository = "https://github.com/sankaHQ/sanka-migrate"
Issues = "https://github.com/sankaHQ/sanka-migrate/issues"

[tool.uv.sources]
sanka-migrate-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["src/ferry"]
