[project]
name = "ferry-migrate"
version = "0.1.0.dev0"
description = "Ferry Migration Runtime — plan, execute, and verify finite migrations between databases, warehouses, files, and business systems"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Sanka" }]
keywords = ["migration", "etl", "ferry", "data", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "ferry-connector-sdk",
  "pyyaml>=6",
]

[project.scripts]
ferry = "ferry.cli:main"

[project.urls]
Repository = "https://github.com/sankaHQ/ferry"

[tool.uv.sources]
ferry-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ferry"]
