# Workspace root — not a published package. Shared tooling config for all packages.
[project]
name = "sanka-cli-workspace"
version = "0.0.0"
description = "Development workspace for the Sanka open-source monorepo"
requires-python = ">=3.12,<3.15"

[tool.uv]
package = false

[tool.uv.sources]
sanka-connector-sdk = { index = "sanka-testpypi" }
sanka-connector-clickhouse = { index = "sanka-testpypi" }
sanka-connector-csv = { index = "sanka-testpypi" }
sanka-connector-markdown = { index = "sanka-testpypi" }
sanka-connector-postgres = { index = "sanka-testpypi" }
sanka-connector-sqlite = { index = "sanka-testpypi" }

[[tool.uv.index]]
name = "sanka-testpypi"
url = "https://test.pypi.org/simple"
explicit = true

[tool.uv.workspace]
members = [
  "packages/sanka-cli",
]

[dependency-groups]
dev = [
  "ruff>=0.12",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "django>=5.2,<7",
  "djangorestframework>=3.16,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "sanka-connector-clickhouse==0.1.0a9",
  "sanka-connector-csv==0.1.0a9",
  "sanka-connector-markdown==0.1.0a9",
  "sanka-connector-postgres==0.1.0a9",
  "sanka-connector-sdk==0.1.0a9",
  "sanka-connector-sqlite==0.1.0a9",
  "types-pyyaml>=6",
  "tortoise-orm>=1.1,<2",
  "aiosqlite>=0.20,<1",
  "sqlalchemy>=2.0,<3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.format]
# ruff >= 0.16 formats fenced Python blocks in Markdown by default. Markdown
# here (design docs especially) carries illustrative sketches with
# hand-aligned comments — review artifacts, not formatter-owned code.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
  "sanka",
  "sanka_cli",
  "sanka_extensions",
  "sanka_connector",
  "sanka_extension_sdk",
  "sanka_connector_clickhouse",
  "sanka_connector_csv",
  "sanka_connector_markdown",
  "sanka_connector_postgres",
  "sanka_connector_sqlite",
]

[tool.mypy]
strict = true
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
exclude = ["tests/fixtures"]
mypy_path = [
  "packages/sanka-cli/src",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = [
  "packages/sanka-cli/tests",
  "tests",
]
