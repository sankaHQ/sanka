# Workspace root — not a published package. Shared tooling config for all packages.
[project]
name = "sanka-migrate-workspace"
version = "0.0.0"
description = "Development workspace for the Sanka open-source monorepo"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/sanka-migrate",
  "packages/sanka-migrate-mcp",
]

[dependency-groups]
dev = [
  "ruff>=0.12",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "django>=5.2,<7",
  "djangorestframework>=3.16,<4",
  "types-pyyaml>=6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.format]
# ruff >= 0.16 formats fenced Python blocks in Markdown by default. Markdown
# here (design docs especially) carries illustrative sketches with
# hand-aligned comments — review artifacts, not formatter-owned code.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
  "sanka",
  "sanka_connector_clickhouse",
  "sanka_connector_csv",
  "sanka_connector_hubspot",
  "sanka_connector_markdown",
  "sanka_connector_postgres",
  "sanka_connector_salesforce",
  "sanka_connector_sqlite",
  "sanka_migrate_mcp",
]

[tool.mypy]
strict = true
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
exclude = ["tests/fixtures"]
mypy_path = [
  "packages/sanka-migrate/src",
  "packages/sanka-migrate-mcp/src",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = [
  "packages/sanka-migrate/tests",
  "packages/sanka-migrate-mcp/tests",
  "connectors/csv/tests",
  "connectors/hubspot/tests",
  "connectors/markdown/tests",
  "connectors/postgres/tests",
  "connectors/salesforce/tests",
  "connectors/sqlite/tests",
  "connectors/clickhouse/tests",
  "tests",
]
