# Workspace root — not a published package. Shared tooling config for all packages.
[project]
name = "ferry-workspace"
version = "0.0.0"
description = "Development workspace for the Ferry Migration Runtime monorepo"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/*",
  "connectors/clickhouse",
  "connectors/csv",
  "connectors/markdown",
  "connectors/postgres",
  "connectors/salesforce",
  "connectors/sqlite",
]

[dependency-groups]
dev = [
  "ruff>=0.12",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "types-pyyaml>=6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ferry"]

[tool.mypy]
strict = true
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
mypy_path = [
  "packages/ferry-connector-sdk/src",
  "packages/ferry-migrate/src",
  "connectors/csv/src",
  "connectors/markdown/src",
  "connectors/postgres/src",
  "connectors/salesforce/src",
  "connectors/sqlite/src",
  "connectors/clickhouse/src",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = [
  "packages/ferry-connector-sdk/tests",
  "packages/ferry-migrate/tests",
  "connectors/csv/tests",
  "connectors/markdown/tests",
  "connectors/postgres/tests",
  "connectors/salesforce/tests",
  "connectors/sqlite/tests",
  "connectors/clickhouse/tests",
  "tests",
]
