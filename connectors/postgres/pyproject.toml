[project]
name = "sanka-migrate-connector-postgres"
version = "0.1.0a1"
description = "Sanka Migrate connector: read from and write to PostgreSQL databases"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
dependencies = [
  "sanka-migrate-connector-sdk",
  "psycopg[binary]>=3.2",
]

[project.entry-points."sanka.connectors"]
postgres = "sanka_connector_postgres:CONNECTOR"

[project.urls]
Repository = "https://github.com/sankaHQ/sanka"
Issues = "https://github.com/sankaHQ/sanka/issues"

[tool.uv.sources]
sanka-migrate-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_connector_postgres"]
