[project]
name = "sanka-migrate-connector-clickhouse"
version = "0.1.0.dev0"
description = "Sanka Migrate connector: write migration records into a ClickHouse database"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
dependencies = [
  "sanka-migrate-connector-sdk",
  "clickhouse-connect>=0.8",
]

[project.entry-points."ferry.connectors"]
clickhouse = "ferry_connector_clickhouse:CONNECTOR"

[project.urls]
Repository = "https://github.com/sankaHQ/sanka-migrate"
Issues = "https://github.com/sankaHQ/sanka-migrate/issues"

[tool.uv.sources]
sanka-migrate-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["src/ferry_connector_clickhouse"]
