[project]
name = "ferry-connector-salesforce"
version = "0.1.0.dev0"
description = "Ferry connector: read Salesforce organizations as a migration source"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
dependencies = [
  "ferry-connector-sdk",
  "httpx>=0.27",
]

[project.entry-points."ferry.connectors"]
salesforce = "ferry_connector_salesforce:CONNECTOR"

[project.urls]
Repository = "https://github.com/sankaHQ/ferry"

[tool.uv.sources]
ferry-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ferry_connector_salesforce"]
