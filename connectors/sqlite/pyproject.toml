[project]
name = "sanka-migrate-connector-sqlite"
version = "0.1.0.dev0"
description = "Sanka Migrate connector: read and write SQLite databases as a migration source and destination"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
dependencies = [
  "sanka-migrate-connector-sdk",
]

[project.entry-points."sanka.connectors"]
sqlite = "sanka_connector_sqlite:CONNECTOR"

[project.urls]
Repository = "https://github.com/sankaHQ/sanka-migrate"
Issues = "https://github.com/sankaHQ/sanka-migrate/issues"

[tool.uv.sources]
sanka-migrate-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_connector_sqlite"]
