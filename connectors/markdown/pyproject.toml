[project]
name = "sanka-migrate-connector-markdown"
version = "0.1.0.dev0"
description = "Sanka Migrate connector: read a Markdown directory (frontmatter + body) as a migration source"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
dependencies = [
  "sanka-migrate-connector-sdk",
  "pyyaml>=6",
]

[project.entry-points."sanka.connectors"]
markdown = "sanka_connector_markdown:CONNECTOR"

[project.urls]
Repository = "https://github.com/sankaHQ/sanka"
Issues = "https://github.com/sankaHQ/sanka/issues"

[tool.uv.sources]
sanka-migrate-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_connector_markdown"]
