name: Installer acceptance
on:
  pull_request:
    paths:
      - install.sh
      - scripts/smoke_installer.py
      - .github/workflows/install-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install interactive shells on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: python3 scripts/smoke_installer.py --version 0.2.12 --upgrade-from 0.2.9 --report installer-smoke.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installer-${{ matrix.os }}
          path: installer-smoke.json
          retention-days: 10
