name: Bench

# Sanka Migration Bench regression gate: generate candidates from this
# trusted main revision and grade them with the tool-neutral evaluator.
# sanka-bench is private, so this job must never run in a pull-request trust
# domain. SANKA_BENCH_TOKEN is a fine-grained, read-only repository token.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Check bench token
        id: token
        env:
          HAVE_TOKEN: ${{ secrets.SANKA_BENCH_TOKEN != '' }}
        run: echo "have=${HAVE_TOKEN}" >> "$GITHUB_OUTPUT"
      - name: Skip (no SANKA_BENCH_TOKEN secret configured)
        if: steps.token.outputs.have != 'true'
        run: echo "SANKA_BENCH_TOKEN is not configured; the bench gate was skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.have == 'true'
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.have == 'true'
        with:
          repository: sankaHQ/sanka-bench
          token: ${{ secrets.SANKA_BENCH_TOKEN }}
          path: .bench/sanka-bench
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.token.outputs.have == 'true'
      - name: Sync
        if: steps.token.outputs.have == 'true'
        run: uv sync --frozen --all-packages
      - name: Run bench gate
        if: steps.token.outputs.have == 'true'
        run: make bench BENCH_DIR=.bench/sanka-bench
