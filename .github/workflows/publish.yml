name: Publish sanka-cli

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter publish- followed by the exact selected version tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify exact tag
    if: inputs.confirmation == format('publish-{0}', github.ref_name)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sanka
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sanka
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - name: Require a matching version tag
        run: uv run python scripts/check_release_tag.py "$GITHUB_REF_NAME" "$GITHUB_REF_TYPE"
      - name: Install the locked workspace
        run: uv sync --frozen --all-packages
      - name: Run repository checks
        run: make check
      - name: Build and stage release
        run: make build-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanka-cli-${{ github.ref_name }}
          path: sanka/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish exact artifacts to PyPI
    if: inputs.confirmation == format('publish-{0}', github.ref_name)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sanka-cli-${{ github.ref_name }}
          path: release/
      - name: Verify source and artifact hashes
        working-directory: release
        run: |
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS
          rm SHA256SUMS SOURCE_COMMIT
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/
          print-hash: true
