name: Publish sanka-cli

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter publish- followed by the exact selected version tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify exact tag
    if: inputs.confirmation == format('publish-{0}', github.ref_name)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sanka
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sanka
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - name: Require a matching version tag
        run: uv run python scripts/check_release_tag.py "$GITHUB_REF_NAME" "$GITHUB_REF_TYPE"
      - name: Install the locked workspace
        run: uv sync --frozen --all-packages --all-extras
      - name: Run repository checks
        run: make check
      - name: Build and stage release
        run: make build-release
      - name: Verify published Flow SDK compatibility
        run: make flow-wheel-acceptance
      - name: Verify the published Business Flow package
        run: make business-flow-acceptance
      - name: Verify the built wheel against the public quickstart
        run: make quickstart-acceptance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: candidate-quickstart
          path: sanka/quickstart-acceptance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanka-cli-${{ github.ref_name }}
          path: sanka/release/
          if-no-files-found: error
          retention-days: 14

  extension-compatibility:
    name: Extension compatibility (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sanka-cli-${{ github.ref_name }}
          path: release/
      - name: Verify selected source and exact staged artifact hashes
        run: |
          test "$(cat release/SOURCE_COMMIT)" = "$GITHUB_SHA"
          (cd release && shasum -a 256 --check SHA256SUMS)
      - name: Test candidate with existing independent extension lock
        run: make extension-acceptance CLI_WHEEL='release/sanka_cli-*-py3-none-any.whl'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: extension-acceptance-${{ matrix.os }}
          path: extension-acceptance.json
          if-no-files-found: error

  publish:
    name: Publish exact artifacts to PyPI
    if: inputs.confirmation == format('publish-{0}', github.ref_name)
    needs: [build, extension-compatibility]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sanka-cli-${{ github.ref_name }}
          path: release/
      - name: Verify source and artifact hashes
        working-directory: release
        run: |
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS
          rm SHA256SUMS SOURCE_COMMIT
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/
          print-hash: true

  ready:
    name: Verify public PyPI availability
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sanka-cli-${{ github.ref_name }}
          path: release/
      - name: Wait for both metadata and the install index
        run: |
          python3 scripts/wait_for_pypi.py --version "${GITHUB_REF_NAME#v}" \
            --source-commit "$GITHUB_SHA" --release-dir release \
            --timeout 300 --report pypi-readiness.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pypi-readiness
          path: pypi-readiness.json

  installer:
    name: Publish installer for the verified PyPI release
    needs: ready
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sanka-cli-${{ github.ref_name }}
          path: release/
      - name: Install interactive shell acceptance dependency
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Test public package installation without system Python
        run: python3 scripts/smoke_installer.py --version "${GITHUB_REF_NAME#v}" --upgrade-from 0.2.9 --report installer-smoke.json
      - name: Verify the public PyPI quickstart
        run: python3 scripts/smoke_quickstart.py --cli "sanka-cli==${GITHUB_REF_NAME#v}" --upgrade-from 0.2.14 --report quickstart-acceptance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: published-quickstart
          path: quickstart-acceptance.json
          if-no-files-found: error
      - name: Verify and publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(cat release/SOURCE_COMMIT)" = "$GITHUB_SHA"
          (cd release && sha256sum --check SHA256SUMS)
          grep -F "    version=${GITHUB_REF_NAME#v}" install.sh
          cp install.sh release/install.sh
          cp docs/install.md release/install.md
          (cd release && sha256sum install.sh install.md >> SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
            --title "Sanka CLI $GITHUB_REF_NAME" --notes-file docs/install.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sanka-cli-installer-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-installer-acceptance
          path: installer-smoke.json
          retention-days: 10

  homebrew:
    name: Prepare and test the matching Homebrew update
    needs: installer
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sankaHQ/homebrew-cli
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sanka-cli-installer-${{ github.ref_name }}
          path: release/
      - name: Prepare from verified public source bytes
        run: |
          test "$(cat release/SOURCE_COMMIT)" = "$GITHUB_SHA"
          (cd release && shasum -a 256 --check SHA256SUMS)
          brew trust --formula sankahq/cli/sanka
          brew tap sankaHQ/cli
          SOURCE_HASH=$(awk '/\.tar\.gz$/ {print $1}' release/SHA256SUMS)
          python3 scripts/prepare_release.py --version "${GITHUB_REF_NAME#v}" \
            --expected-sha256 "$SOURCE_HASH"
          cp release/install.sh install.sh
          mkdir -p docs
          cp release/install.md docs/install.md
          grep -F "    version=${GITHUB_REF_NAME#v}" install.sh
      - name: Build and test without replacing another installation
        run: sh scripts/check_formula.sh
      - name: Record channel completion separately
        run: |
          mkdir -p handoff
          git add --intent-to-add install.sh docs/install.md
          git diff --binary -- Formula/sanka.rb install.sh docs/install.md > handoff/homebrew.patch
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          report = json.loads(Path("release-status.json").read_text())
          report.update(homebrew="review_required", homebrew_validation="passed-macos",
                        homebrew_base_commit=subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                        linux_validation="required by the Homebrew PR CI before merge",
                        installer="published with the CLI release",
                        installer_mirror="public after the Homebrew PR merges",
                        installer_url="https://github.com/sankaHQ/sanka/releases/latest/download/install.sh",
                        installer_mirror_url="https://raw.githubusercontent.com/sankaHQ/homebrew-cli/main/install.sh")
          Path("handoff/release-status.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
          cat handoff/release-status.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homebrew-${{ github.ref_name }}-review
          path: handoff/
          retention-days: 10
