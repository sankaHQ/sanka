name: Publish Python packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index target
        required: true
        type: choice
        options:
          - testpypi
          - pypi
          - bootstrap-testpypi
          - bootstrap-pypi
      package:
        description: One package for a bootstrap target; ignored for normal targets
        required: true
        default: sanka-migrate-connector-sdk
        type: choice
        options:
          - sanka-migrate-connector-sdk
          - sanka-migrate-connector-clickhouse
          - sanka-migrate-connector-csv
          - sanka-migrate-connector-hubspot
          - sanka-migrate-connector-markdown
          - sanka-migrate-connector-postgres
          - sanka-migrate-connector-salesforce
          - sanka-migrate-connector-sqlite
          - sanka-migrate-mcp
          - sanka-migrate
      confirmation:
        description: Enter the exact target, or target-package for a bootstrap target
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify exact tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - name: Require a matching version tag
        run: uv run python scripts/check_release_tag.py "$GITHUB_REF_NAME" "$GITHUB_REF_TYPE"
      - name: Install the locked workspace
        run: uv sync --frozen --all-packages
      - name: Run repository checks
        run: make check
      - name: Build and dry-run publication
        run: make build-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish-testpypi:
    name: Publish to TestPyPI
    if: >-
      vars.SANKA_MIGRATE_PUBLISH_ENABLED == 'true' &&
      inputs.target == 'testpypi' &&
      inputs.confirmation == 'publish-testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-${{ github.ref_name }}
          path: release/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/all/
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

  publish-pypi:
    name: Publish to PyPI
    if: >-
      vars.SANKA_MIGRATE_PUBLISH_ENABLED == 'true' &&
      inputs.target == 'pypi' &&
      inputs.confirmation == 'publish-pypi'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-${{ github.ref_name }}
          path: release/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/all/
          print-hash: true

  bootstrap-testpypi:
    name: Bootstrap ${{ inputs.package }} on TestPyPI
    if: >-
      vars.SANKA_MIGRATE_BOOTSTRAP_ENABLED == 'true' &&
      inputs.target == 'bootstrap-testpypi' &&
      inputs.confirmation == format('bootstrap-testpypi-{0}', inputs.package)
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.package == 'sanka-migrate' && 'testpypi' || format('testpypi-{0}', inputs.package) }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-${{ github.ref_name }}
          path: release/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/packages/${{ inputs.package }}/
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

  bootstrap-pypi:
    name: Bootstrap ${{ inputs.package }} on PyPI
    if: >-
      vars.SANKA_MIGRATE_BOOTSTRAP_ENABLED == 'true' &&
      inputs.target == 'bootstrap-pypi' &&
      inputs.confirmation == format('bootstrap-pypi-{0}', inputs.package)
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.package == 'sanka-migrate' && 'pypi' || format('pypi-{0}', inputs.package) }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-${{ github.ref_name }}
          path: release/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/packages/${{ inputs.package }}/
          print-hash: true
