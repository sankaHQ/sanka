name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sanka
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sanka
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-packages --all-extras
      - run: make check
      - run: make build-release
      - run: make flow-wheel-acceptance
      - run: make quickstart-acceptance
      - run: make extension-acceptance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: extension-acceptance
          path: sanka/extension-acceptance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: quickstart-acceptance
          path: sanka/quickstart-acceptance.json
          if-no-files-found: error
